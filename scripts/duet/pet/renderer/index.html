<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file:; script-src 'self' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' data: file:; object-src 'none'; base-uri 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./pet.css" />
    <title>ZCode 小人</title>
  </head>
  <body>
    <div id="app" class="expanded" data-state="offline">
      <section class="panel" id="panel" aria-label="小人对话">
        <header class="panel-header">
          <div class="drag-handle" id="drag-handle" title="拖动小人"></div>
          <div class="status">
            <span class="status-dot" id="status-dot"></span>
            <span id="status-text">连接宿管中…</span>
          </div>
          <button class="icon-button" id="hide-button" title="收起" type="button">—</button>
        </header>

        <div class="messages" id="messages" aria-live="polite"></div>
        <div class="activity" id="activity" aria-live="polite"></div>

        <section class="preview" id="preview" hidden>
          <div class="preview-title" id="preview-title">改动</div>
          <div class="preview-files" id="preview-files"></div>
          <div class="preview-warning" id="preview-warning" hidden></div>
        </section>

        <div class="actions" id="actions" hidden>
          <button class="primary" id="activate-button" type="button">验证并重启</button>
          <button class="secondary" id="rollback-button" type="button">回滚</button>
          <button class="ghost" id="log-button" type="button">看日志</button>
        </div>

        <form class="composer" id="composer">
          <textarea id="input" rows="2" placeholder="跟小人说点什么…"></textarea>
          <div class="composer-row">
            <button type="button" class="ghost" id="reset-button">重置</button>
            <button type="button" class="ghost" id="stop-button" hidden>停止</button>
            <button type="submit" class="primary" id="send-button">发送</button>
          </div>
        </form>
      </section>

      <button class="mascot" id="mascot" title="点我聊天" aria-label="展开对话" type="button">
        <svg class="mascot-svg" viewBox="0 0 120 120" role="img" aria-hidden="true">
          <defs>
            <linearGradient id="body-gradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#8b7cff" />
              <stop offset="100%" stop-color="#4dd4c6" />
            </linearGradient>
            <radialGradient id="glow-gradient" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#8b7cff" stop-opacity="0.45" />
              <stop offset="100%" stop-color="#8b7cff" stop-opacity="0" />
            </radialGradient>
          </defs>
          <ellipse class="mascot-shadow" cx="60" cy="108" rx="30" ry="6" />
          <circle class="mascot-glow" cx="60" cy="62" r="52" fill="url(#glow-gradient)" />
          <g class="mascot-body">
            <rect x="26" y="32" width="68" height="62" rx="28" fill="url(#body-gradient)" />
            <circle class="eye eye-left" cx="48" cy="58" r="5.5" />
            <circle class="eye eye-right" cx="72" cy="58" r="5.5" />
            <path class="mouth" d="M52 74 Q60 80 68 74" />
            <line class="antenna-stem" x1="60" y1="32" x2="60" y2="18" />
            <circle class="antenna-tip" cx="60" cy="16" r="5" />
            <g class="gear">
              <circle
                cx="60"
                cy="71"
                r="7"
                fill="none"
                stroke="rgba(255,255,255,0.85)"
                stroke-width="2"
                stroke-dasharray="4 3"
              />
            </g>
          </g>
        </svg>
      </button>
    </div>
    <script type="module" src="./pet.js"></script>
  </body>
</html>
